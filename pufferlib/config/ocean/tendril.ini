[base]
package = ocean
env_name = puffer_tendril
policy_name = Policy
rnn_name = None

[vec]
backend = Multiprocessing
num_envs = 1
num_workers = 1
batch_size = auto
seed = 42

[env]

[policy]
hidden_size = 256

[train]
name = tendril-ppo-10M
project = tendril-pufferlib-ppo
total_timesteps = 10_000_000
learning_rate = 2.5e-4
gamma = 0.99
gae_lambda = 0.95
update_epochs = 4
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
optimizer = adam
batch_size = 65536
minibatch_size = 8192
device = cuda
checkpoint_interval = 1000
seed = 42

[sweep]
method = protein
metric = success_rate

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 1e7
mean = 5e6
scale = 0.5

[sweep.train.gamma]
distribution = log_normal
min = 0.95
max = 0.999
mean = 0.99

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.8
max = 0.999
mean = 0.95

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.001
mean = 0.0003
scale = 0.5

[sweep.train.batch_size]
min = 8192
max = 32768
mean = 16384
scale = 0.5

[sweep.train.minibatch_size]
min = 1024
max = 8192
mean = 4096
scale = 0.5